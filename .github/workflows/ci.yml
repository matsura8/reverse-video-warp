name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference-worker/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --requirement inference-worker/requirements-test.txt
      - name: Compile worker sources
        run: python -m compileall -q inference-worker
      - name: Run worker tests
        env:
          PYTHONPATH: inference-worker
        run: python -m unittest discover -s inference-worker/tests -v

