[package]
name = "reversewarp-host"
description = "ReverseWarp native messaging and localhost live-frame host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "reversewarp-host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal"] }

[lints]
workspace = true
